name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Signs with the release key when the secrets are set (not on pull requests from forks).
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "M3U_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: signing with a debug key."
          fi

      - name: Build
        env:
          M3U_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          M3U_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          M3U_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          VERSION=$(grep -m1 "versionName" app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          cp app/build/outputs/apk/release/m3u-lite-release.apk "m3u-lite-$VERSION.apk"
          sha256sum "m3u-lite-$VERSION.apk" | tee "m3u-lite-$VERSION.apk.sha256"
          echo "APK=m3u-lite-$VERSION.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: m3u-lite
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "M3U Lite $GITHUB_REF_NAME" --generate-notes
